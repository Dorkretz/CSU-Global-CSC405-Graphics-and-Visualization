<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Subdivision Sphere – WebGL 1.0</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root{--bg:#111;--fg:#eee;--accent:#26c6da;font-size:16px}
        body{margin:0;background:var(--bg);color:var(--fg);
            font-family:system-ui,Roboto,Arial,sans-serif;
            display:flex;flex-direction:column;min-height:100vh}
        header,footer{padding:.6rem 1rem;background:#0003;backdrop-filter:blur(4px)}
        main{flex:1;display:flex;flex-direction:column;align-items:center;
            justify-content:center;padding:.5rem}
        canvas{width:100%;max-width:640px;aspect-ratio:1/1;border:1px solid #444;
            touch-action:none}
        label{display:inline-flex;align-items:center;gap:.3rem}
        input[type=range]{width:8rem}
        a{color:var(--accent)}
    </style>
</head>
<body>
<header>
    Recursive Subdivision Sphere
</header>

<main>
    <canvas id="gl-canvas"></canvas>
    <div style="margin-top:.5rem">
        <label>Recursion depth:
            <input id="depth" type="range" min="0" max="6" step="1" value="3">
            <span id="depthVal">3</span>
        </label>
    </div>
</main>

<script type="module">
    // WebGL Context
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl",{antialias:true});
    if(!gl){alert("WebGL unsupported");throw"no webgl";}

    const vs = `
attribute vec4 aPosition;
attribute vec3 aNormal;
uniform mat4 uModel,uView,uProj;
varying vec3 vN,vL,vE;
void main(){
    vec4 wp = uModel * aPosition;
    vec3 N  = normalize(mat3(uModel)*aNormal);
    vec3 L  = normalize(vec3(1.0,1.0,1.0));
    vec3 E  = normalize(-wp.xyz);
    vN=N; vL=L; vE=E;
    gl_Position = uProj * uView * wp;
}`;
    const fs = `
precision mediump float;
varying vec3 vN,vL,vE;
void main(){
    vec3 N = normalize(vN);
    vec3 L = normalize(vL);
    vec3 E = normalize(vE);
    vec3 R = reflect(-L,N);
    float kd = max(dot(N,L),0.0);
    float ks = pow(max(dot(R,E),0.0),32.0);
    vec3 color = vec3(0.1,0.7,1.0)*kd + vec3(1.0)*ks;
    gl_FragColor = vec4(color,1.0);
}`;

    // Compiles
    function shader(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);
        gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
            throw gl.getShaderInfoLog(s);return s;}
    const program = gl.createProgram();
    gl.attachShader(program,shader(vs,gl.VERTEX_SHADER));
    gl.attachShader(program,shader(fs,gl.FRAGMENT_SHADER));
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))
        throw gl.getProgramInfoLog(program);
    gl.useProgram(program);

    // Math helpers
    function vec4(x,y,z,w=1){return new Float32Array([x,y,z,w]);}
    function mix(a,b,s){return vec4(a[0]*(1-s)+b[0]*s,
        a[1]*(1-s)+b[1]*s,
        a[2]*(1-s)+b[2]*s,1);}
    function normalize(v){
        const l=Math.hypot(v[0],v[1],v[2]);
        return vec4(v[0]/l,v[1]/l,v[2]/l,1);
    }
    function persp(fovy,aspect,near,far){
        const f=1/Math.tan(fovy/2),nf=1/(near-far);
        return new Float32Array([f/aspect,0,0,0, 0,f,0,0,
            0,0,(far+near)*nf,-1,
            0,0,(2*far*near)*nf,0]);
    }
    function lookAt(e,a,u){
        let z=normalize(vec4(e[0]-a[0],e[1]-a[1],e[2]-a[2],0));
        let x=normalize(vec4(u[1]*z[2]-u[2]*z[1],
            u[2]*z[0]-u[0]*z[2],
            u[0]*z[1]-u[1]*z[0],0));
        let y=vec4(z[1]*x[2]-z[2]*x[1],
            z[2]*x[0]-z[0]*x[2],
            z[0]*x[1]-z[1]*x[0],0);
        return new Float32Array([
            x[0],y[0],z[0],0,
            x[1],y[1],z[1],0,
            x[2],y[2],z[2],0,
            -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),
            -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),
            -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);
    }

    // Generates the geometry
    const va = vec4( 0.0, 0.0, -1.0, 1);
    const vb = vec4( 0.0, 0.942809, 0.333333, 1);
    const vc = vec4(-0.816497,-0.471405,0.333333,1);
    const vd = vec4( 0.816497,-0.471405,0.333333,1);

    let positions=[],numVertices=0;
    function push(p){positions.push(p[0],p[1],p[2],p[3],p[0],p[1],p[2]);}
    function triangle(a,b,c){push(a);push(b);push(c);}
    function divideTri(a,b,c,n){
        if(n>0){
            const ab=normalize(mix(a,b,0.5));
            const ac=normalize(mix(a,c,0.5));
            const bc=normalize(mix(b,c,0.5));
            divideTri(a,ab,ac,n-1);
            divideTri(ab,b,bc,n-1);
            divideTri(bc,c,ac,n-1);
            divideTri(ab,bc,ac,n-1);
        }else triangle(a,b,c);
    }
    function build(depth){
        positions.length=0;
        divideTri(va,vb,vc,depth);
        divideTri(vd,vc,vb,depth);
        divideTri(va,vd,vb,depth);
        divideTri(va,vc,vd,depth);
        numVertices=positions.length/7;
    }

    // Buffer
    const vBuf=gl.createBuffer();
    function upload(){
        gl.bindBuffer(gl.ARRAY_BUFFER,vBuf);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(positions),gl.STATIC_DRAW);
        const stride=7*4;
        const aPos=gl.getAttribLocation(program,"aPosition");
        const aNor=gl.getAttribLocation(program,"aNormal");
        gl.vertexAttribPointer(aPos,4,gl.FLOAT,false,stride,0);
        gl.vertexAttribPointer(aNor,3,gl.FLOAT,false,stride,4*4);
        gl.enableVertexAttribArray(aPos);
        gl.enableVertexAttribArray(aNor);
    }

    // Uniforms
    const uModel=gl.getUniformLocation(program,"uModel");
    const uView =gl.getUniformLocation(program,"uView");
    const uProj =gl.getUniformLocation(program,"uProj");

    // render Loop
    let rot=[0,0];
    const SCALE=0.7;
    function draw(){
        canvas.width=canvas.clientWidth;
        canvas.height=canvas.clientHeight;
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.clearColor(0.05,0.05,0.05,1);
        gl.enable(gl.DEPTH_TEST);
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

        const c=Math.cos,s=Math.sin,ry=rot[0],rx=rot[1];
        const model=new Float32Array([
            SCALE*c(ry),              0,      SCALE*s(ry),0,
            SCALE*s(rx)*s(ry), SCALE*c(rx), -SCALE*s(rx)*c(ry),0,
            -SCALE*c(rx)*s(ry), SCALE*s(rx),  SCALE*c(rx)*c(ry),0,
            0,0,0,1]);
        gl.uniformMatrix4fv(uModel,false,model);
        gl.uniformMatrix4fv(uView,false,lookAt([0,0,2.5],[0,0,0],[0,1,0]));
        gl.uniformMatrix4fv(uProj,false,persp(Math.PI/4,
            canvas.width/canvas.height,0.1,10));

        gl.drawArrays(gl.TRIANGLES,0,numVertices);
        requestAnimationFrame(draw);
    }

    // Interaction
    let dragging=false,last=[0,0];
    canvas.addEventListener("pointerdown",e=>{
        dragging=true;last=[e.clientX,e.clientY];});
    canvas.addEventListener("pointermove",e=>{
        if(!dragging)return;
        rot[0]+=(e.clientX-last[0])*0.01;
        rot[1]+=(e.clientY-last[1])*0.01;
        last=[e.clientX,e.clientY];
    });
    window.addEventListener("pointerup",()=>dragging=false);

    // Slider
    const depthSlider=document.getElementById("depth");
    const depthVal=document.getElementById("depthVal");
    function rebuild(){
        build(+depthSlider.value);
        depthVal.textContent=depthSlider.value;
        upload();
    }
    depthSlider.addEventListener("input",rebuild);

    // Starts
    rebuild();
    draw();
</script>
</body>
</html>
